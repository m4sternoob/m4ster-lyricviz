[package]
name = "lyricviz"
version = "1.0.1"
description = "LyricViz — a lyric visualizer with synced, word-by-word lyrics"
authors = ["m4sternoob"]
edition = "2021"

[lib]
name = "lyricviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Release tuning: full optimization for the native build —
# link-time optimization on, a single codegen unit, and debug
# symbols stripped. Smaller binary, faster start.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
